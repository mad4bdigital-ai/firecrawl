name: MAD4B Firecrawl Fork CI

on:
  pull_request:
    branches:
      - main
      - sync/upstream-20261029
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: mad4b-fork-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-and-compose:
    name: Fork safety and Compose contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Reject unguarded upstream release jobs and invalid workflow syntax
        run: python scripts/ci/verify_fork_workflows.py
      - name: Validate Compose syntax only (no containers or deployment)
        run: docker compose -f docker-compose.yaml config --quiet

  python-sdk-unit:
    name: Python SDK unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/python-sdk/requirements.txt
      - name: Install SDK dependencies
        working-directory: apps/python-sdk
        run: |
          python -m pip install --disable-pip-version-check -r ../../.github/pip-bootstrap.txt
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check -e .
      - name: Run Python unit tests
        working-directory: apps/python-sdk
        run: python -m pytest firecrawl/__tests__/unit -q

  js-sdk-unit:
    name: JavaScript SDK unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/js-sdk/firecrawl/pnpm-lock.yaml
      - name: Install and test
        working-directory: apps/js-sdk/firecrawl
        env:
          HUSKY: "0"
        run: |
          pnpm install --frozen-lockfile
          pnpm run test:unit

  api-compile:
    name: API TypeScript build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/api/pnpm-lock.yaml
      - name: Install FoundationDB native client headers
        env:
          FDB_VERSION: "7.3.63"
        run: |
          curl -fsSL -o /tmp/fdb-clients.deb "https://github.com/apple/foundationdb/releases/download/${FDB_VERSION}/foundationdb-clients_${FDB_VERSION}-1_amd64.deb"
          sudo dpkg -i /tmp/fdb-clients.deb
          test -f /usr/include/foundationdb/fdb_c.h
      - name: Install dependencies
        working-directory: apps/api
        env:
          HUSKY: "0"
        run: pnpm install --frozen-lockfile
      - name: TypeScript build
        working-directory: apps/api
        run: pnpm run build
